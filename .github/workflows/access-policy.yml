name: Access policy contract
on:
  push:
    branches: [feat/portal-accesos-centralizados]
  pull_request:
    paths: ['access/**', 'tests/**', 'package.json', '.github/workflows/access-policy.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
